services:
  todo:
    # 直接用 GitHub Actions 构建好的镜像；想本地构建就注释掉 image、放开 build
    image: ghcr.io/silentflower/uiineed-todo-list:latest
    # build: .
    container_name: uiineed-todo-list
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 必填：签发登录令牌的密钥。不设置时会在数据目录自动生成一份随机密钥
      JWT_SECRET: ${JWT_SECRET:-}
      # 站点跑在 HTTPS 后面时设为 1，让登录 Cookie 带上 Secure
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      # 数据库与图片都在这里，删容器不会丢数据
      - todo-data:/data

volumes:
  todo-data:
